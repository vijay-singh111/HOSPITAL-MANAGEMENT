		<div class="main-wrapper login-body">
			<div class="login-wrapper">
				<div class="container">
					<div class="loginbox">
						<div class="login-left">
							<img class="img-fluid" src="../hospital/assets/img/logo-white.png" alt="Logo">
						</div>
						<div class="login-right">
							<div class="login-right-wrap">
								<h1>Add Patient</h1>
								<div th:if="${msg}" class="py-4">
									<p th:text="${msg}" class="alert alert-success "></p>
								</div>

								<!-- Form -->
								<form method="post" th:object="${dto}">
									<div class="form-group">
										<input class="form-control" type="text" th:field="*{name}"

									</div>
									<div class="form-group">
										<input class="form-control" type="text" th:field="*{age}" placeholder="Age"
											required>
									</div>
									<div class="form-group">
										<select class="form-control" th:field="*{gender}">
											<option value="">---select Gender----</option>
											<option value="Male">Male</option>
											<option value="Female">Famale</option>
											<option value="Other">Other</option>
										</select>
									</div>
									<div class="form-group">
										<select class="form-control" th:field="*{blood}">
											<option value="">---select Blood ----</option>
											<option value="A+">A+</option>
											<option value="AB_">AB-</option>
											<option value="O-">O-</option>
											<option value="O+">O+</option>
											<option value="AB+">AB+</option>
											<option value="A-">A-</option>
										</select>
									</div>

										<input class="form-control" type="email" th:field="*{email}"

									<div class="form-group">
										<input class="form-control" type="text" th:field="*{contact}"
											placeholder="Phone">
									</div>
									<div class="form-group">
										<textarea class="form-control"  th:field="*{address}"
											placeholder="Address... "></textarea>
									</div>
									<div class="form-group mb-0">
										<button class="btn btn-primary btn-block" type="submit">Add Patient</button>
									</div>
								</form>
