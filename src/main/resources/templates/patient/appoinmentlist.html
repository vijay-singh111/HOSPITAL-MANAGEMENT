<!DOCTYPE html >
<html lang="en" th:replace="patient/patientbase::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

   

   <section>

	   <div class="content container-fluid">

	   				<!-- Page Header -->
	   				<div class="page-header">
	   					<div class="row">
	   						<div class="col-sm-12">
	   							<h3 class="page-title">List of Patient</h3>
	   							<ul class="breadcrumb">
	   								<li class="breadcrumb-item"><a href="#">Dashboard</a></li>
	   						
	   								<li class="breadcrumb-item active">Patient List</li>
	   							</ul>
	   						</div>
	   					</div>
	   				</div>
	   				<!-- /Page Header -->

	   				<div class="row">
	   					<div class="col-sm-12">
	   						<div class="card">
	   							<div class="card-body">
									
	   								<div class="table-responsive">
	   									<div class="table-responsive">
	   									
	   										<table class="datatable table table-hover table-center mb-0">
	   											<thead>
	   												<tr>
	   													<th>Registation No</th>
	   													<th>Patient Name</th>
	   													<th>Age</th>
														<th>Gender</th>
														<th>Blood</th>
														<th>Email</th>
														<th>Date</th>
	   												
	   													<th>Conact</th>
														<th>Department</th>
														<th>Doctor</th>
														<th>Postdate</th>
	   													<th class="text-right">
	   														<div class="actions">
	   															<!--<a class="btn btn-sm bg-success-light" data-toggle="modal"
	   																href="#edit_specialities_details">
	   																<i class="fe fe-pencil"></i> Edit
	   															</a>-->
	   															<a data-toggle="modal" href="#delete_modal"
	   																class="btn btn-sm bg-danger-light">
	   																<i class="fe fe-trash"></i> Delete
	   															</a>
	   														</div>
	   													</th>
	   												</tr>
	   											</thead>
	   											<tbody>
	   												
	   												<tr th:each="a: ${alist}">
	   													<td th:text="${a.regno}"></td>
	   													<td th:text="${a.name}"></td>
	   													<td th:text="${a.age}"></td>
	   													<td th:text="${a.gender}"></td>
														<td th:text="${a.blood}"></td>
														<td th:text="${a.email}"></td>
	   													<td th:text="${a.apdate}"></td>
														<td th:text="${a.contact}"></td>
														<td th:text="${a.department}"></td>
														<td th:text="${a.dr}"></td>
														<td th:text="${a.postdate}"></td>
	   													<td>
	   													
	   													<td class="text-right">
	   														<div class="actions">
	   															<!--<a class="btn btn-sm bg-success-light"
	   													th:href="@{patientlist/update(id=${p.id})}">
	   																<i class="fe fe-pencil"></i> Edit
	   															</a>-->
	   															<a th:href="@{appoinmentlist/delete(id=${a.id})}"
	   																onclick="return confirm('Are you sure you want to delete this patient?')"
	   																class="btn btn-sm bg-danger-light">
	   																<i class="fe fe-trash"></i> Delete
	   															</a>
	   														</div>
	   													</td>
	   												</tr>

	   										</table>
	   									</div>
	   								</div>
	   							</div>
	   						</div>
	   					</div>
	   				</div>

	   			</div>
   </section>
	
</body>
</html>
