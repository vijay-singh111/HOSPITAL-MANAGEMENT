<!DOCTYPE html>
<html>
<head>
    <title>Patient Details</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef; padding: 30px; }
        .card {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        .card h2 { margin-top: 0; }
        .info p { margin: 10px 0; font-size: 18px; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            background: #007BFF;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>

</head>
<body >
<div class="card">
    <h2>Patient Info</h2>
    <div class="info">
        <p><strong>ID:</strong> <span th:text="${ap.apdate}"></span></p>
        <p><strong>Name:</strong> <span th:text="${ap.name}"></span></p>
        <p><strong>Age:</strong> <span th:text="${ap.age}"></span></p>
        <p><strong>Gender:</strong> <span th:text="${ap.gender}"></span></p>
    </div>
    <a class="btn" href="/patients/form">Add Another Patient</a>
</div>
</body>
</html>
