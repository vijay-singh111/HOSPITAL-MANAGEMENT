<!DOCTYPE html>
<html lang="en" th:replace="hospital/hospitalbase::layout(~{::section})">

<head>
	<title>Portal - Bootstrap 5 Admin Dashboard Template For Developers</title>

	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="description" content="Portal - Bootstrap 5 Admin Dashboard Template For Developers">
	<meta name="author" content="Xiaoying Riley at 3rd Wave Media">
	<link rel="shortcut icon" href="favicon.ico">



</head>

<body>
	<section>

		<!-- Section: Design Block -->
		<section>
			<div class="page-ttl">
				<div class="layer-stretch">
					<div class="page-ttl-container">
						<h1>Appoinment</h1>
						<p><a href="#">Home</a> &#8594; <span>Appoinment</span></p>
					</div>
				</div>
			</div><!-- End page Title Section -->

			<!-- Start My Profile Section -->
			<div id="profile-page" class="layer-stretch">
				<div class="layer-wrapper">
					<div th:if="${msg}">
						<p th:text="${msg}"
							style="font-weight: 600; font-size: 18px; font-family: Arial, Helvetica, sans-serif; color: rgb(255, 0, 0);"
							class="alert test-success alert-dismissible"></p>
					</div>

					<form method="post" th:object="${dto}">
						<div class="theme-material-card text-center">
							<div class="row">
								<div class="col-md-4">
									<div
										class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label form-input-icon">
										<i class="fa fa-user-o"></i>
										<input class="mdl-textfield__input" type="text" th:field="${dto.name}"
											pattern="[A-Z,a-z, ]*" id="profile-name">
										<label class="mdl-textfield__label" for="profile-name">Name</label>
										<span class="mdl-textfield__error">Please Enter Valid Name!</span>
									</div>
									<div
										class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label form-input-icon">
										<i class="fa fa-envelope-o"></i>
										<input class="mdl-textfield__input" type="text" th:field="${dto.email}"
											pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$" id="profile-email">
										<label class="mdl-textfield__label" for="profile-email">Email</label>
										<span class="mdl-textfield__error">Please Enter Valid Email!</span>
									</div>
									<div
										class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label form-input-icon">
										<i class="fa fa-phone"></i>
										<input class="mdl-textfield__input" type="text" th:field="${dto.contact}"
											pattern="[0-9]*" id="profile-mobile">
										<label class="mdl-textfield__label" for="profile-mobile">Mobile Number</label>
										<span class="mdl-textfield__error">Please Enter Valid Mobile Number!</span>
									</div>
								</div>
								<div class="col-md-4">
									<div
										class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label form-input-icon">
										<i class="fa fa-calendar"></i>
										<input class="mdl-textfield__input" type="text" th:field="${dto.age}">
										<label class="mdl-textfield__label" for="profile-birthdate">Age</label>
										<span class="mdl-textfield__error">Please Enter Valid AGE!</span>
									</div>
									<div
										class="mdl-selectfield mdl-js-selectfield mdl-selectfield--floating-label form-input-icon">
										<i class="fa fa-tint"></i>
										<select class="mdl-selectfield__select" th:field="${dto.blood}" name="bloodgroup"
											id="profile-bloodgroup">
											<option value=""></option>
											<option value="O-">O-</option>
											<option value="O+">O+</option>
											<option value="A-">A-</option>
											<option value="A+">A+</option>
											<option value="B-">B-</option>
											<option value="B+">B+</option>
											<option value="AB-">AB-</option>
											<option value="AB+">AB+</option>
										</select>
										<label class="mdl-selectfield__label" for="profile-bloodgroup">Select
											Bloodgroup</label>
									</div>
									<div
										class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label form-input-icon">
										<i class="fa fa-calendar-o"></i>
										<input class="mdl-textfield__input" type="text" th:field="${dto.apdate}"
											id="appointment-date" onfocus="(this.type='date')"
											onblur="(this.type='text')">
										<label class="mdl-textfield__label" for="appointment-date">Date</label>
										<span class="mdl-textfield__error">Please Enter Valid Date Number!</span>
									</div>
								</div>
								<div class="col-md-4">
									<div
										class="mdl-selectfield mdl-js-selectfield mdl-selectfield--floating-label form-input-icon">
										<i class="fa fa-male"></i>
										<select class="mdl-selectfield__select" th:field="${dto.gender}"
											id="profile-gender">
											<option value=""></option>
											<option value="Male">Male</option>
											<option value="Female">Female</option>
											<option value="Other">Other</option>
										</select>
										<label class="mdl-selectfield__label" for="profile-gender">Select Gender</label>
									</div>
									<div
										class="mdl-selectfield mdl-js-selectfield mdl-selectfield--floating-label form-input-icon">
										<i class="fa fa-hospital-o"></i>
										<select class="mdl-selectfield__select" th:field="${dto.department}"
											id="appointment-department">
											<option value="">&nbsp;</option>
											<option value="Gynaecolog">Gynaecology</option>
											<option value="Orthology">Orthology</option>
											<option value="Dermatologist">Dermatologist</option>
											<option value="Anaesthesia">Anaesthesia</option>
											<option value="Ayurvedic">Ayurvedic</option>
										</select>
										<label class="mdl-selectfield__label" for="appointment-department">Choose
											Department</label>
									</div>

									<div
										class="mdl-selectfield mdl-js-selectfield mdl-selectfield--floating-label form-input-icon">
										<i class="fa fa-user-md"></i>
										<select class="mdl-selectfield__select" th:field="${dto.dr}"
											id="appointment-doctor">
											<option value="">&nbsp;</option>
											<option value="Dr. Daniel Barnes">Dr. Daniel Barnes</option>
											<option value="Dr. Steve Soeren">Dr. Steve Soeren</option>
											<option value="Dr. Barbara Baker">Dr. Barbara Baker</option>
											<option value="Dr. Melissa Bates">Dr. Melissa Bates</option>
											<option value="Dr. Linda Adams">Dr. Linda Adams</option>
										</select>
										<label class="mdl-selectfield__label" for="appointment-doctor">Choose
											Doctor</label>
									</div>

								</div>
							</div>

							<div class="form-submit">
								<button type="submit"
									class="mdl-button mdl-js-button mdl-js-ripple-effect button button-primary">Submit</button>
							</div>
						</div>
					</form>
				</div>
			</div><!-- End My Profile Section -->
		</section>
		<!-- Section: Design Block -->
	</section>
</body>

</html>
