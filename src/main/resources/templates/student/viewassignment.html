<html  th:replace="student/studentbase::layout(~{::section})">

<head>
</head>

<body>
	<section>

		<h1 class="text-center" style="color: blue;">View your Assignment</h1>
				<table class="table table-border mb-5" style="width: 95%; margin: auto; margin-bottom: 250px;">

				<thead>
					<tr class="table-success">
						<th >
							Subject

						</th>
						<th>
							Topic

						</th>
						<th>
							File
							<i class="fas fa-fw fa-download"></i>
						</th>
						<th>
							Posteddate

						</th>


					</trclass="table-success">
				</thead>
				<tbody>
					<tr th:each="m:${mlist}">
						<td th:text="${m.subject}"></td>
						<td th:text="${m.topic}"></td>
						<td>
							<a th:href="@{'/material/'+${m.filename}}" download><span th:text="${m.filename}"></span><i class="fas fa-fw fa-download"></i></a>
						</td>
						<td th:text="${m.posteddate}"></td>
					</tr>
					</tbody>
				</table>


	</section>
</body>

</html>
