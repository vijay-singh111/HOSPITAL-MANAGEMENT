<!DOCTYPE html>
<html lang="en" th:replace="base::layout(~{::section})">

<head>
	<meta charset="UTF-8">
	<title>Login Page in HTML with CSS Code Example</title>
	<link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">


	<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
		integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
	<link rel="stylesheet" href="./style.css">

</head>

<body>
	<!-- partial:index.partial.html -->
	<section>
		<!-- Preloader -->
		  <div class="preloader">
		      <div class="loader">
		          <div class="loader-outter"></div>
		          <div class="loader-inner"></div>

		          <div class="indicator">
		              <svg width="16px" height="12px">
		                  <polyline id="back" points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
		                  <polyline id="front" points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
		              </svg>
		          </div>
		      </div>
		  </div>
		  <!-- End Preloader -->
		<div class="box-form mt-5">
				<div class="left">
					<div class="overla">
						<h1>Add patient.</h1>
						<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.
							Curabitur et est sed felis aliquet sollicitudin</p>
						<span>
							<p>login with social mediya</p>
							<a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a>
							<a href="#"><i class="fa fa-twitter" aria-hidden="true"></i> Login with Twitter</a>
						</span>
					</div>
				</div>


				<div class="right">
					<h5 class="text-center mb-5">Login</h5>
					<p>Don't have an account? <a href="#">Creat Your Account</a> it takes less than a minute</p>
					<div class="inputs">
						<input type="text" placeholder="user name">
						<br>
						<input type="password" placeholder="password">
					</div>

					<br><br>

					<div class="remember-me--forget-password">
						<!-- Angular -->
						<label class="lb">
							<input type="checkb" name="item" checked />
							<span class="text-checkb">Remember me</span>
						</label>
						<p>forget password?</p>
					</div>

					<br>
					<button>Login</button>
				</div>

			</div>
			<!-- partial -->
	</section>

</body>

</html>
